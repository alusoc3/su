<html lang="ja"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>先生の放課後スケジュール・行事管理</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-top: 0;
      font-size: 22px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f8fafc;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      margin-bottom: 20px;
    }
    .form-row {
      display: flex;
      gap: 10px;
    }
    .form-row > * {
      flex: 1;
    }
    label {
      font-size: 12px;
      font-weight: bold;
      color: #4a5568;
      margin-bottom: 4px;
      display: block;
    }
    input, select {
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }
    button.add-btn {
      padding: 12px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.add-btn:hover {
      background-color: #2563eb;
    }
    
    /* リスト表示 */
    ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    li {
      background: #fff;
      padding: 12px 15px;
      border: 1px solid #e2e8f0;
      border-left: 5px solid #3b82f6;
      border-radius: 5px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    /* 種別ごとの線色 */
    li.type-会議 { border-left-color: #ef4444; } /* 赤 */
    li.type-行事 { border-left-color: #f59e0b; } /* オレンジ */
    li.type-部活 { border-left-color: #10b981; } /* 緑 */
    li.type-その他 { border-left-color: #6b7280; } /* グレー */

    .task-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .task-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .teacher-badge {
      background: #e0f2fe;
      color: #0369a1;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }
    .type-badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #f1f5f9;
      color: #475569;
    }
    .task-title {
      font-size: 15px;
      font-weight: bold;
      color: #1e293b;
    }
    .task-meta {
      font-size: 12px;
      color: #64748b;
    }
    .delete-btn {
      background-color: #fee2e2;
      color: #ef4444;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .delete-btn:hover {
      background-color: #fca5a5;
      color: white;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>放課後スケジュール・行事管理</h1>
  
  <div class="form-group">
    <div class="form-row">
      <div>
        <label for="teacherSelect">担当（先生の名前）</label>
        <select id="teacherSelect">
          <option value="">名前を選択...</option>
          <option value="小松先生">小松先生</option>
          <option value="中塚先生">中塚先生</option>
          <option value="塩沢誉先生">塩沢誉先生</option>
          <option value="塩澤仁志先生">塩澤仁志先生</option>
          <option value="福澤先生">福澤先生</option>
          <option value="丸山先生">丸山先生</option>
          <option value="清水先生">清水先生</option>
          <!-- 先生の名前は自由に追加・変更できます -->
        </select>
      </div>
      <div>
        <label for="typeSelect">種別</label>
        <select id="typeSelect">
          <option value="会議">会議</option>
          <option value="行事">行事</option>
          <option value="部活">部活</option>
          <option value="その他">その他</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div>
        <label for="dateInput">日付</label>
        <input type="date" id="dateInput">
      </div>
      <div>
        <label for="timeInput">時間</label>
        <input type="time" id="timeInput">
      </div>
    </div>

    <div>
      <label for="taskInput">予定・内容</label>
      <input type="text" id="taskInput" placeholder="例：学年会議、保護者会準備 など">
    </div>

    <button class="add-btn" onclick="addTask()">スケジュールを追加</button>
  </div>

  <h2>予定一覧</h2>
  <ul id="taskList"><li class="type-その他">
      <div class="task-details">
        <div class="task-header">
          <span class="teacher-badge">塩澤仁志先生</span>
          <span class="type-badge">その他</span>
          <span class="task-title">ホームパーティー</span>
        </div>
        <div class="task-meta">
          📅 2026-09-16 13:51〜
        </div>
      </div>
      <button class="delete-btn" onclick="deleteTask(1789444270880)">削除</button>
    </li></ul>
</div>

<script>
  document.addEventListener("DOMContentLoaded", loadTasks);

  function addTask() {
    const teacher = document.getElementById("teacherSelect").value;
    const type = document.getElementById("typeSelect").value;
    const date = document.getElementById("dateInput").value;
    const time = document.getElementById("timeInput").value;
    const text = document.getElementById("taskInput").value.trim();

    if (!teacher) {
      alert("先生の名前を選択してください");
      return;
    }
    if (!date) {
      alert("日付を選択してください");
      return;
    }
    if (text === "") {
      alert("予定の内容を入力してください");
      return;
    }

    const task = {
      id: Date.now(),
      teacher: teacher,
      type: type,
      date: date,
      time: time,
      text: text
    };

    saveTaskToStorage(task);
    reloadTasks();

    // 入力欄をクリア
    document.getElementById("taskInput").value = "";
    document.getElementById("timeInput").value = "";
  }

  function renderTask(task) {
    const taskList = document.getElementById("taskList");
    const li = document.createElement("li");
    li.className = `type-${task.type}`;

    const timeDisplay = task.time ? ` ${task.time}〜` : '';

    li.innerHTML = `
      <div class="task-details">
        <div class="task-header">
          <span class="teacher-badge">${escapeHtml(task.teacher)}</span>
          <span class="type-badge">${escapeHtml(task.type)}</span>
          <span class="task-title">${escapeHtml(task.text)}</span>
        </div>
        <div class="task-meta">
          📅 ${task.date}${timeDisplay}
        </div>
      </div>
      <button class="delete-btn" onclick="deleteTask(${task.id})">削除</button>
    `;

    taskList.appendChild(li);
  }

  function saveTaskToStorage(task) {
    const tasks = getTasksFromStorage();
    tasks.push(task);
    // 日付順に並び替え
    tasks.sort((a, b) => new Date(a.date + ' ' + (a.time || '00:00')) - new Date(b.date + ' ' + (b.time || '00:00')));
    localStorage.setItem("school_tasks", JSON.stringify(tasks));
  }

  function getTasksFromStorage() {
    return localStorage.getItem("school_tasks") ? JSON.parse(localStorage.getItem("school_tasks")) : [];
  }

  function loadTasks() {
    const tasks = getTasksFromStorage();
    tasks.forEach(task => renderTask(task));
  }

  function reloadTasks() {
    document.getElementById("taskList").innerHTML = "";
    loadTasks();
  }

  function deleteTask(id) {
    if (!confirm("この予定を削除しますか？")) return;
    let tasks = getTasksFromStorage();
    tasks = tasks.filter(task => task.id !== id);
    localStorage.setItem("school_tasks", JSON.stringify(tasks));
    reloadTasks();
  }

  function escapeHtml(str) {
    return str.replace(/[&<>'"]/g, tag => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[tag] || tag));
  }
</script>



</body></html>
